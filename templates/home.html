<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServerPanel — Professional Dashboard</title>
  <style>
    /* ---------------- GLOBAL RESET & VARIABLES ---------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-body: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.07);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------------- TOP HEADER ---------------- */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .brand-icon svg { width: 22px; height: 22px; }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    /* ---------------- BUTTONS ---------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary { background: #fff; color: var(--text-main); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }

    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: var(--success-hover); }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    /* ---------------- MAIN CONTAINER & STATS ---------------- */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      width: 100%;
      flex: 1;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.15rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stat-blue { background: #eff6ff; color: var(--primary); }
    .stat-green { background: #ecfdf5; color: var(--success); }
    .stat-gray { background: #f1f5f9; color: var(--text-muted); }
    .stat-val { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
    .stat-label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); }

    /* ---------------- FILTER BAR ---------------- */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .search-input {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      min-width: 220px;
    }
    .filter-select {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      cursor: pointer;
    }

    /* ---------------- SERVER CARD ---------------- */
    .servers-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .server-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .server-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.85rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .server-identity {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-running { background: #ecfdf5; color: var(--success); }
    .badge-stopped { background: #f1f5f9; color: var(--text-muted); }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background-color: currentColor; }
    .server-name-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .server-specs-row { font-size: 0.8rem; color: var(--text-muted); }

    .server-nav-tools {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ---------------- SERVER CONTROLS (IMAGE EXACT MATCH) ---------------- */
    .controls-panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.25rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .controls-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }
    .controls-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .control-buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
    }
    .btn-ctrl {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.15s ease;
    }
    .btn-ctrl-start { background-color: #10b981; }
    .btn-ctrl-start:hover:not(:disabled) { background-color: #059669; }

    .btn-ctrl-stop { background-color: #ef4444; }
    .btn-ctrl-stop:hover:not(:disabled) { background-color: #dc2626; }

    .btn-ctrl-restart { background-color: #2563eb; }
    .btn-ctrl-restart:hover:not(:disabled) { background-color: #1d4ed8; }

    /* ---------------- RECENT LOGS (IMAGE EXACT MATCH) ---------------- */
    .logs-panel {
      background: #0b1329;
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      color: #93c5fd;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      box-shadow: var(--shadow-sm);
    }
    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-family: var(--font-family);
    }
    .logs-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
    .logs-view-all {
      font-size: 0.8rem;
      font-weight: 600;
      color: #38bdf8;
      cursor: pointer;
      text-decoration: none;
    }
    .logs-view-all:hover { text-decoration: underline; }

    .terminal-body-preview {
      font-size: 0.82rem;
      line-height: 1.6;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #e2e8f0;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .log-ts { color: #60a5fa; }
    .log-success { color: #4ade80; }

    /* ---------------- MODALS ---------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 90vh;
    }
    .modal-card.modal-lg { max-width: 860px; }
    .modal-card.modal-xl { max-width: 1080px; height: 85vh; }
    .modal-header {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; }
    .modal-close-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text-muted);
    }
    .modal-body {
      padding: 1.4rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-footer {
      padding: 1rem 1.4rem;
      border-top: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    /* Form Fields */
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
    .form-control {
      padding: 0.55rem 0.85rem;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    /* Full Terminal */
    .full-terminal {
      background: #0b1329;
      color: #e2e8f0;
      font-family: monospace;
      padding: 1rem;
      border-radius: var(--radius-sm);
      height: 380px;
      overflow-y: auto;
      font-size: 0.82rem;
      white-space: pre-wrap;
    }
    .terminal-input-bar { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .terminal-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 0.55rem 0.85rem;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      outline: none;
    }

    /* File Table */
    .files-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    .files-table th { background: #f8fafc; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); }
    .files-table td { padding: 0.65rem 0.85rem; border-bottom: 1px solid #f1f5f9; }

    /* Toast */
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 100; pointer-events: none; }
    .toast { min-width: 260px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 0.85rem 1.1rem; font-size: 0.85rem; font-weight: 500; pointer-events: auto; }
    .toast-success { border-left: 4px solid var(--success); }
    .toast-error { border-left: 4px solid var(--danger); }

    @media (max-width: 640px) {
      .control-buttons-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" /></svg>
        </div>
        <div>
          <div class="brand-title">ServerPanel</div>
          <div class="brand-subtitle">Manage Your Servers Easily</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="loadServers(true)">↻ Refresh</button>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Create Server</button>
      </div>
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <main class="main-container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon stat-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-label">Total Servers</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-running">0</div>
          <div class="stat-label">Running Servers</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-gray">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-stopped">0</div>
          <div class="stat-label">Stopped Servers</div>
        </div>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search servers..." oninput="renderDashboard()" />
      <select id="status-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Status</option>
        <option value="running">Running</option>
        <option value="stopped">Stopped</option>
      </select>
    </div>

    <!-- DYNAMIC SERVERS LIST -->
    <div id="servers-container" class="servers-list"></div>

    <div id="empty-state" style="display:none; text-align:center; padding:3rem; background:#fff; border-radius:12px; border:2px dashed #cbd5e1;">
      <h3>No servers found</h3>
      <p style="color:#64748b; margin-top:0.25rem;">Create a new server to start running your bot.</p>
    </div>
  </main>

  <!-- ================= MODALS ================= -->

  <!-- Create Server Modal -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Create New Server</h3>
        <button class="modal-close-btn" onclick="closeModal('modal-create')">&times;</button>
      </div>
      <form onsubmit="handleCreateServerSubmit(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Server Name</label>
            <input type="text" id="create-name" class="form-control" placeholder="e.g. My Telegram Bot" required />
          </div>
          <div class="form-group">
            <label class="form-label">Server Type</label>
            <input type="text" id="create-type" class="form-control" value="Python" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Allocated RAM</label>
            <select id="create-ram" class="form-control">
              <option value="512 MB">512 MB</option>
              <option value="1 GB" selected>1 GB</option>
              <option value="2 GB">2 GB</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Allocated Disk</label>
            <select id="create-disk" class="form-control">
              <option value="1 GB" selected>1 GB</option>
              <option value="2 GB">2 GB</option>
              <option value="5 GB">5 GB</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-create')">Cancel</button>
          <button type="submit" id="btn-submit-create" class="btn btn-primary">Create Server</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Full Console Modal -->
  <div id="modal-console" class="modal-overlay">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="console-modal-title">Terminal Console</h3>
        <button class="modal-close-btn" onclick="closeConsoleModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="terminal-content" class="full-terminal">Loading logs...</div>
        <form class="terminal-input-bar" onsubmit="handleCommandSubmit(event)">
          <input type="text" id="terminal-cmd-input" class="terminal-input" placeholder="> Enter shell command..." autocomplete="off" />
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <button type="button" class="btn btn-secondary" onclick="clearConsoleLogs()">Clear Logs</button>
        <button type="button" class="btn btn-secondary" onclick="closeConsoleModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- File Manager Modal -->
  <div id="modal-files" class="modal-overlay">
    <div class="modal-card modal-xl">
      <div class="modal-header">
        <h3 class="modal-title" id="fileman-modal-title">File Manager</h3>
        <button class="modal-close-btn" onclick="closeModal('modal-files')">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:0.6rem; border-radius:6px; border:1px solid #e2e8f0;">
          <div id="fileman-breadcrumbs" style="font-family:monospace; font-size:0.85rem;">/</div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-secondary btn-sm" onclick="promptCreateFolder()">+ Folder</button>
            <label class="btn btn-primary btn-sm" style="cursor:pointer; margin:0;">
              Upload
              <input type="file" id="fileman-upload-input" style="display:none;" onchange="handleFileUpload(event)" />
            </label>
          </div>
        </div>
        <table class="files-table">
          <thead>
            <tr>
              <th>Name</th><th>Size</th><th>Modified</th><th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="files-table-body"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-files')">Close</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Server Settings</h3>
        <button class="modal-close-btn" onclick="closeModal('modal-settings')">&times;</button>
      </div>
      <form onsubmit="handleSettingsSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="settings-server-id" />
          <div class="form-group">
            <label class="form-label">Server Name</label>
            <input type="text" id="settings-name" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label">Startup File</label>
            <input type="text" id="settings-startup" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label">Requirements File</label>
            <input type="text" id="settings-requirements" class="form-control" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-settings')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- ================= LOGIC & SCRIPT ================= -->
  <script>
    let serversData = {};
    let activeConsoleServerId = null;
    let consoleInterval = null;
    let currentFileManagerServerId = null;
    let currentFileManagerPath = "";

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadServers(manual = false) {
      try {
        const res = await fetch('/api/servers');
        const data = await res.json();
        if (data.status === 'success') {
          serversData = data.servers || {};
          renderDashboard();
          if (manual) showToast('Servers refreshed');
        }
      } catch (e) {
        if (manual) showToast(e.message, 'error');
      }
    }

    function renderDashboard() {
      const list = Object.values(serversData);
      const query = (document.getElementById('search-input').value || '').toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      let running = 0, stopped = 0;
      list.forEach(s => s.status === 'running' ? running++ : stopped++);
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-running').textContent = running;
      document.getElementById('stat-stopped').textContent = stopped;

      const filtered = list.filter(s => {
        const matchQ = s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query);
        const matchS = statusFilter === 'all' || s.status === statusFilter;
        return matchQ && matchS;
      });

      const container = document.getElementById('servers-container');
      const emptyState = document.getElementById('empty-state');

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      container.innerHTML = filtered.map(server => {
        const isRunning = server.status === 'running';
        return `
          <div class="server-card">
            <!-- Header Row with specs and quick tools -->
            <div class="server-top-header">
              <div>
                <div class="server-identity">
                  <span class="badge ${isRunning ? 'badge-running' : 'badge-stopped'}">
                    <span class="badge-dot"></span>
                    ${isRunning ? 'Running' : 'Stopped'}
                  </span>
                  <span class="server-name-title">${escapeHtml(server.name)}</span>
                </div>
                <div class="server-specs-row">
                  ${server.type} • ${server.ram} RAM • ${server.disk} Disk • PID: <strong>${server.pid || 'None'}</strong>
                </div>
              </div>
              <div class="server-nav-tools">
                <button class="btn btn-secondary btn-sm" onclick="openFileManager('${server.id}')">📁 Files</button>
                <button class="btn btn-secondary btn-sm" onclick="openSettings('${server.id}')">⚙️ Settings</button>
                <button class="btn btn-secondary btn-sm" style="color:var(--danger);" onclick="deleteServer('${server.id}')">🗑️ Delete</button>
              </div>
            </div>

            <!-- SERVER CONTROLS (EXACT DESIGN) -->
            <div class="controls-panel">
              <div class="controls-title">Server Controls</div>
              <div class="controls-subtitle">Start, stop or restart your server</div>
              <div class="control-buttons-grid">
                <button class="btn-ctrl btn-ctrl-start" ${isRunning ? 'disabled' : ''} onclick="startServer('${server.id}')">
                  ▶ Start
                </button>
                <button class="btn-ctrl btn-ctrl-stop" ${!isRunning ? 'disabled' : ''} onclick="stopServer('${server.id}')">
                  ■ Stop
                </button>
                <button class="btn-ctrl btn-ctrl-restart" onclick="restartServer('${server.id}')">
                  🔄 Restart
                </button>
              </div>
            </div>

            <!-- RECENT LOGS (EXACT DESIGN) -->
            <div class="logs-panel">
              <div class="logs-header">
                <span class="logs-title">Recent Logs</span>
                <span class="logs-view-all" onclick="openConsole('${server.id}')">View All</span>
              </div>
              <div class="terminal-body-preview" id="log-preview-${server.id}">Fetching live logs...</div>
            </div>
          </div>
        `;
      }).join('');

      // Auto update the inline logs for all displayed servers
      filtered.forEach(s => fetchPreviewLog(s.id));
    }

    async function fetchPreviewLog(id) {
      try {
        const res = await fetch(`/api/logs/${id}`);
        const data = await res.json();
        const el = document.getElementById(`log-preview-${id}`);
        if (el && data.status === 'success') {
          el.textContent = data.logs.trim() ? data.logs.split('\n').slice(-8).join('\n') : "Server output logs will appear here...";
          el.scrollTop = el.scrollHeight;
        }
      } catch (e) {}
    }

    // Server power actions
    async function startServer(id) {
      showToast('Starting server...');
      const res = await fetch(`/api/start/${id}`, { method: 'POST' });
      const data = await res.json();
      showToast(data.message, data.status);
      loadServers();
    }

    async function stopServer(id) {
      showToast('Stopping server...');
      const res = await fetch(`/api/stop/${id}`, { method: 'POST' });
      const data = await res.json();
      showToast(data.message, data.status);
      loadServers();
    }

    async function restartServer(id) {
      showToast('Restarting server...');
      const res = await fetch(`/api/restart/${id}`, { method: 'POST' });
      const data = await res.json();
      showToast(data.message, data.status);
      loadServers();
    }

    async function deleteServer(id) {
      if (!confirm("Are you sure you want to permanently delete this server?")) return;
      const res = await fetch(`/api/server/${id}`, { method: 'DELETE' });
      const data = await res.json();
      showToast(data.message, data.status);
      loadServers();
    }

    // Modal Operations
    function openCreateModal() { openModal('modal-create'); }

    async function handleCreateServerSubmit(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('create-name').value.trim(),
        type: document.getElementById('create-type').value,
        ram: document.getElementById('create-ram').value,
        disk: document.getElementById('create-disk').value
      };
      const res = await fetch('/api/create_server', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      showToast(data.message, data.status);
      closeModal('modal-create');
      loadServers();
    }

    // Terminal / Console
    function openConsole(id) {
      activeConsoleServerId = id;
      openModal('modal-console');
      fetchFullLogs();
      if (consoleInterval) clearInterval(consoleInterval);
      consoleInterval = setInterval(fetchFullLogs, 2500);
    }

    function closeConsoleModal() {
      closeModal('modal-console');
      activeConsoleServerId = null;
      if (consoleInterval) clearInterval(consoleInterval);
    }

    async function fetchFullLogs() {
      if (!activeConsoleServerId) return;
      const res = await fetch(`/api/logs/${activeConsoleServerId}`);
      const data = await res.json();
      const term = document.getElementById('terminal-content');
      term.textContent = data.logs || 'No output recorded yet.';
      term.scrollTop = term.scrollHeight;
    }

    async function handleCommandSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('terminal-cmd-input');
      const cmd = input.value.trim();
      if (!cmd || !activeConsoleServerId) return;

      await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ server_id: activeConsoleServerId, command: cmd })
      });
      input.value = '';
      fetchFullLogs();
    }

    async function clearConsoleLogs() {
      if (!activeConsoleServerId) return;
      await fetch(`/api/clear_logs/${activeConsoleServerId}`, { method: 'POST' });
      fetchFullLogs();
    }

    // File Manager
    function openFileManager(id, path = '') {
      currentFileManagerServerId = id;
      currentFileManagerPath = path;
      openModal('modal-files');
      loadFiles(id, path);
    }

    async function loadFiles(id, path = '') {
      currentFileManagerPath = path;
      document.getElementById('fileman-breadcrumbs').textContent = '/' + path;
      const res = await fetch(`/api/files/${id}?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      const tbody = document.getElementById('files-table-body');
      tbody.innerHTML = (data.items || []).map(item => `
        <tr>
          <td>${item.is_dir ? '📁' : '📄'} ${escapeHtml(item.name)}</td>
          <td>${item.is_dir ? '-' : item.size + ' B'}</td>
          <td>${item.modified}</td>
          <td style="text-align:right;">
            <button class="btn btn-secondary btn-sm" onclick="deleteFileItem('${path ? path + '/' + item.name : item.name}')">Del</button>
          </td>
        </tr>
      `).join('');
    }

    async function promptCreateFolder() {
      const name = prompt("Folder Name:");
      if (!name) return;
      await fetch(`/api/create_folder/${currentFileManagerServerId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder_name: name, path: currentFileManagerPath })
      });
      loadFiles(currentFileManagerServerId, currentFileManagerPath);
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('path', currentFileManagerPath);
      await fetch(`/api/upload/${currentFileManagerServerId}`, { method: 'POST', body: fd });
      loadFiles(currentFileManagerServerId, currentFileManagerPath);
      e.target.value = '';
    }

    async function deleteFileItem(p) {
      if (!confirm("Delete this item?")) return;
      await fetch(`/api/file/${currentFileManagerServerId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: p })
      });
      loadFiles(currentFileManagerServerId, currentFileManagerPath);
    }

    // Settings
    function openSettings(id) {
      const s = serversData[id];
      if (!s) return;
      document.getElementById('settings-server-id').value = id;
      document.getElementById('settings-name').value = s.name;
      document.getElementById('settings-startup').value = s.startup_file || 'main.py';
      document.getElementById('settings-requirements').value = s.requirements_file || 'requirements.txt';
      openModal('modal-settings');
    }

    async function handleSettingsSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('settings-server-id').value;
      const payload = {
        name: document.getElementById('settings-name').value.trim(),
        startup_file: document.getElementById('settings-startup').value.trim(),
        requirements_file: document.getElementById('settings-requirements').value.trim()
      };
      const res = await fetch(`/api/server/${id}/settings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      showToast(data.message, data.status);
      closeModal('modal-settings');
      loadServers();
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadServers();
      setInterval(() => {
        const modalActive = document.querySelector('.modal-overlay.active');
        if (!modalActive) loadServers();
      }, 5000);
    });
  </script>
</body>
</html>
