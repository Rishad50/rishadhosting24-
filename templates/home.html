<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Servers</title>
  <style>
    :root {
      --bg-page: #0a0a0d;
      --card-surface: #131318;
      --card-border: #1c1c24;
      --purple-btn: #9a5bb7;
      --purple-btn-hover: #8848aa;
      --text-white: #ffffff;
      --text-muted-id: #555765;
      --badge-bg: #1c1d25;
      --badge-text: #717382;
      --badge-online-bg: #11241a;
      --badge-online-text: #22c55e;
      --stat-title: #727482;
      --stat-val: #cfcfe0;
      --progress-track: #1f1f2b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* TOAST NOTIFICATION */
    #toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 10px 16px;
      border-radius: 8px;
      background: #1c1d25;
      border-left: 4px solid var(--purple-btn);
      color: #fff;
      font-size: 0.86rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    /* ====================================================
       TOP HEADER: EXACT MATCH WITH SCREENSHOT
    ==================================================== */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 0 2px;
    }
    .top-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-white);
    }
    .btn-create {
      background-color: var(--purple-btn);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-create:hover { background-color: var(--purple-btn-hover); }
    .btn-create:active { transform: scale(0.97); }

    /* ====================================================
       SERVER CARD: EXACT MATCH WITH SCREENSHOT
    ==================================================== */
    .servers-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .server-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 22px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* CARD HEADER: Testing & testing_1779785743 + • OFFLINE */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .server-titles {
      display: flex;
      flex-direction: column;
    }

    .server-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .server-id-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.85rem;
      color: var(--text-muted-id);
      margin-top: 5px;
      letter-spacing: -0.1px;
    }

    /* STATUS BADGE: • OFFLINE / • ONLINE */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--badge-bg);
      color: var(--badge-text);
    }
    .status-badge.online {
      background: var(--badge-online-bg);
      color: var(--badge-online-text);
    }
    .status-badge .bullet-dot {
      font-size: 0.85rem;
      line-height: 0;
    }

    /* STATS METRICS & PROGRESS BARS */
    .stats-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 4px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .stat-name {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--stat-title);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .stat-name svg {
      width: 15px;
      height: 15px;
      fill: var(--stat-title);
    }

    .stat-val {
      font-weight: 600;
      color: var(--stat-val);
      font-size: 0.85rem;
    }

    .progress-bar-track {
      width: 100%;
      height: 3px;
      background: var(--progress-track);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--purple-btn);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.blue { background: #38bdf8; }

    /* MANAGE BUTTON */
    .btn-manage {
      background: var(--purple-btn);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 13px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-manage:hover { background: var(--purple-btn-hover); }
    .btn-manage:active { transform: scale(0.98); }

    /* SUB PANEL (DASHBOARD) */
    .panel-view { display: none; }
    .panel-view.active { display: block; }

    .panel-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .panel-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
    }
    .panel-nav button {
      background: #191a24;
      color: #9295a6;
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .panel-nav button.active {
      background: var(--purple-btn);
      color: #fff;
      border-color: var(--purple-btn);
    }

    .btn-action-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-action {
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-start { background: #16a34a; }
    .btn-stop { background: #dc2626; }
    .btn-restart { background: #7c3aed; }

    /* CONSOLE */
    .terminal {
      background: #08080c;
      border: 1px solid #1c1c28;
      border-radius: 12px;
      height: 380px;
      padding: 12px;
      color: #22c55e;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .terminal-input-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .terminal-input {
      flex-grow: 1;
      background: #0d0d14;
      border: 1px solid #232334;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      outline: none;
      font-family: monospace;
    }

    /* FILE MANAGER */
    .file-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      margin-top: 12px;
    }
    .file-table th, .file-table td {
      padding: 10px 6px;
      text-align: left;
      border-bottom: 1px solid #1a1a28;
    }
    .file-table th { color: var(--stat-title); }
    .file-name-click { cursor: pointer; color: #e2e8f0; font-weight: 500; }
    .file-name-click:hover { color: #c084fc; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #14141e;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
    }
    .modal-box h3 { margin-bottom: 14px; font-size: 1.2rem; }
    .form-input {
      width: 100%;
      background: #0b0b10;
      border: 1px solid #232334;
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      margin-bottom: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--purple-btn); }
    .btn-secondary {
      background: #20202c;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="container">

    <!-- ================= VIEW 1: MY SERVERS (EXACT SCREENSHOT) ================= -->
    <div id="view-servers" class="panel-view active">
      <div class="top-header">
        <h1>My Servers</h1>
        <button class="btn-create" onclick="openCreateModal()">+ CREATE</button>
      </div>

      <div id="servers-list" class="servers-list">
        <!-- Rendered via JS -->
      </div>
    </div>


    <!-- ================= VIEW 2: SERVER DASHBOARD ================= -->
    <div id="view-manage" class="panel-view">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
        <button class="btn-secondary" onclick="backToServers()">← Back</button>
        <span id="active-panel-title" style="font-weight: 700;"></span>
      </div>

      <div class="panel-nav">
        <button class="active" onclick="switchTab('tab-overview')">Overview</button>
        <button onclick="switchTab('tab-console')">Console</button>
        <button onclick="switchTab('tab-files')">Files</button>
        <button onclick="switchTab('tab-settings')">Settings</button>
      </div>

      <!-- OVERVIEW -->
      <div id="tab-overview" class="tab-content">
        <div class="panel-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h2 id="m-server-name" style="font-size: 1.25rem;">Server</h2>
              <p id="m-server-id" class="server-id-text"></p>
            </div>
            <div id="m-status-badge" class="status-badge">
              <span class="bullet-dot">•</span> <span id="m-status-text">OFFLINE</span>
            </div>
          </div>

          <div class="btn-action-group">
            <button class="btn-action btn-start" onclick="powerAction('start')">Start</button>
            <button class="btn-action btn-stop" onclick="powerAction('stop')">Stop</button>
            <button class="btn-action btn-restart" onclick="powerAction('restart')">Restart</button>
          </div>
        </div>

        <div class="panel-card">
          <h4 style="margin-bottom: 12px; font-size: 0.9rem; color: var(--stat-title);">Assigned Resources</h4>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: #0b0b10; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border);">
              <span style="font-size: 0.75rem; color: var(--stat-title);">CPU</span>
              <h3 id="m-cpu" style="margin-top: 4px;">0%</h3>
            </div>
            <div style="background: #0b0b10; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border);">
              <span style="font-size: 0.75rem; color: var(--stat-title);">RAM</span>
              <h3 id="m-ram" style="margin-top: 4px;">0 / 8192 MB</h3>
            </div>
            <div style="background: #0b0b10; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); grid-column: span 2;">
              <span style="font-size: 0.75rem; color: var(--stat-title);">DISK</span>
              <h3 id="m-disk" style="margin-top: 4px;">0 / 20480 MB</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- CONSOLE -->
      <div id="tab-console" class="tab-content" style="display: none;">
        <div class="panel-card" style="padding: 14px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 0.85rem; color: var(--stat-title);">Terminal Log Output</span>
            <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="clearLogs()">Clear</button>
          </div>
          <div id="terminal-box" class="terminal">Loading console...</div>
          <form class="terminal-input-bar" onsubmit="sendCommand(event)">
            <input type="text" id="term-input" class="terminal-input" placeholder="Type command..." autocomplete="off">
            <button type="submit" class="btn-create" style="border-radius: 10px;">Send</button>
          </form>
        </div>
      </div>

      <!-- FILES -->
      <div id="tab-files" class="tab-content" style="display: none;">
        <div class="panel-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span id="fm-path" style="font-size: 0.85rem; color: #a855f7; font-family: monospace;">root</span>
            <div style="display: flex; gap: 6px;">
              <input type="file" id="fm-file-input" style="display: none;" onchange="uploadSelectedFile(event)">
              <button class="btn-secondary" style="font-size: 0.75rem;" onclick="document.getElementById('fm-file-input').click()">↑ Upload</button>
              <button class="btn-secondary" style="font-size: 0.75rem;" onclick="createFolderPrompt()">+ Folder</button>
            </div>
          </div>

          <table class="file-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Size</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="files-list"></tbody>
          </table>
        </div>
      </div>

      <!-- SETTINGS -->
      <div id="tab-settings" class="tab-content" style="display: none;">
        <div class="panel-card">
          <h3 style="margin-bottom: 14px; font-size: 1.1rem;">Configuration</h3>
          <form onsubmit="saveServerSettings(event)">
            <label style="font-size: 0.8rem; color: var(--stat-title);">Server Name</label>
            <input type="text" id="set-name" class="form-input" required>

            <label style="font-size: 0.8rem; color: var(--stat-title);">Startup Script</label>
            <input type="text" id="set-startup" class="form-input" required>

            <label style="font-size: 0.8rem; color: var(--stat-title);">Requirements File</label>
            <input type="text" id="set-reqs" class="form-input" required>

            <button type="submit" class="btn-create" style="width: 100%; justify-content: center;">Save Changes</button>
          </form>

          <hr style="border: none; border-top: 1px solid var(--card-border); margin: 24px 0 16px 0;">

          <button class="btn-secondary" style="background: #ef4444; width: 100%; font-weight: 700;" onclick="deleteActiveServer()">
            Delete Server
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL: CREATE -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-box">
      <h3>Create New Server</h3>
      <form onsubmit="createServerSubmit(event)">
        <label style="font-size: 0.85rem; color: var(--stat-title); margin-bottom: 4px; display: block;">SERVER NAME</label>
        <input type="text" id="create-name" class="form-input" placeholder="e.g. Testing" required>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
          <button type="button" class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
          <button type="submit" class="btn-create">+ CREATE</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: FILE EDITOR -->
  <div id="modal-editor" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <h3 id="edit-file-name">Edit File</h3>
      <textarea id="edit-file-content" class="form-input" style="height: 320px; font-family: monospace; font-size: 0.88rem;"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="btn-secondary" onclick="closeEditorModal()">Cancel</button>
        <button type="button" class="btn-create" onclick="saveFileContent()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let ACTIVE_SERVER_ID = null;
    let CURRENT_FILE_PATH = "";
    let EDITING_TARGET = "";
    let LOG_TIMER = null;

    function showToast(msg, isError = false) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast";
      if (isError) t.style.borderLeftColor = "#ef4444";
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => { t.remove(); }, 3000);
    }

    async function loadServers() {
      try {
        const res = await fetch("/api/servers");
        const data = await res.json();
        if (data.status === "success") {
          renderServerCards(data.servers);
        }
      } catch (err) {
        showToast("Error connecting to panel", true);
      }
    }

    function renderServerCards(servers) {
      const container = document.getElementById("servers-list");
      container.innerHTML = "";

      const keys = Object.keys(servers);
      if (keys.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 16px; color: var(--stat-title); border: 1px dashed var(--card-border); border-radius: 16px;">
            <p>No servers yet. Tap <strong>+ CREATE</strong> above.</p>
          </div>
        `;
        return;
      }

      keys.forEach(id => {
        const s = servers[id];
        const isOnline = s.status === "running";
        const ramUsed = s.ram_used_mb || 0;
        const ramMax = s.ram_max_mb || 8192;
        const ramPercent = Math.min(100, Math.round((ramUsed / ramMax) * 100));

        const diskUsed = s.disk_used_mb || 0;
        const diskMax = s.disk_max_mb || 20480;
        const diskPercent = Math.min(100, Math.round((diskUsed / diskMax) * 100));

        const card = document.createElement("div");
        card.className = "server-card";
        card.innerHTML = `
          <!-- CARD TOP: EXACT SCREENSHOT REPLICA -->
          <div class="card-top">
            <div class="server-titles">
              <div class="server-title">${escapeHtml(s.name)}</div>
              <div class="server-id-text">${escapeHtml(s.id)}</div>
            </div>
            <div class="status-badge ${isOnline ? 'online' : ''}">
              <span class="bullet-dot">•</span> ${isOnline ? 'ONLINE' : 'OFFLINE'}
            </div>
          </div>

          <!-- METRICS BARS -->
          <div class="stats-section">
            <div class="stat-row">
              <div class="stat-labels">
                <span class="stat-name">
                  <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6V4zm2 2v12h8V6H8zm-4 3H2v2h2V9zm0 4H2v2h2v-2zm18-4h-2v2h2V9zm0 4h-2v2h2v-2zM9 2h2v2H9V2zm4 0h2v2h-2V2zm-4 18h2v2H9v-2zm4 0h2v2h-2v-2z"/></svg>
                  CPU
                </span>
                <span class="stat-val">${s.cpu_percent || 0}%</span>
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" style="width: ${Math.min(100, s.cpu_percent || 0)}%"></div>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-labels">
                <span class="stat-name">
                  <svg viewBox="0 0 24 24"><path d="M2 7h20v10H2V7zm2 2v6h16V9H4zm2 1h2v4H6v-4zm4 0h2v4h-2v-4zm4 0h2v4h-2v-4z"/></svg>
                  RAM
                </span>
                <span class="stat-val">${ramUsed} / ${ramMax} MB</span>
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill blue" style="width: ${ramPercent}%"></div>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-labels">
                <span class="stat-name">
                  <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v7h16V6H4zm0 9v3h16v-3H4zm13 1h2v1h-2v-1z"/></svg>
                  DISK
                </span>
                <span class="stat-val">${diskUsed} / ${diskMax} MB</span>
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" style="width: ${diskPercent}%"></div>
              </div>
            </div>
          </div>

          <button class="btn-manage" onclick="openServerDashboard('${s.id}')">
            Manage server ➔
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function openServerDashboard(id) {
      ACTIVE_SERVER_ID = id;
      document.getElementById("view-servers").classList.remove("active");
      document.getElementById("view-manage").classList.add("active");
      switchTab('tab-overview');
      refreshActiveServerData();
    }

    function backToServers() {
      if (LOG_TIMER) clearInterval(LOG_TIMER);
      document.getElementById("view-manage").classList.remove("active");
      document.getElementById("view-servers").classList.add("active");
      loadServers();
    }

    async function refreshActiveServerData() {
      if (!ACTIVE_SERVER_ID) return;
      try {
        const res = await fetch(`/api/server/${ACTIVE_SERVER_ID}`);
        const data = await res.json();
        if (data.status === "success") {
          const s = data.server;
          document.getElementById("active-panel-title").innerText = s.name;
          document.getElementById("m-server-name").innerText = s.name;
          document.getElementById("m-server-id").innerText = s.id;

          const isOnline = s.status === "running";
          const badge = document.getElementById("m-status-badge");
          badge.className = `status-badge ${isOnline ? 'online' : ''}`;
          document.getElementById("m-status-text").innerText = isOnline ? "ONLINE" : "OFFLINE";

          document.getElementById("m-cpu").innerText = `${s.cpu_percent || 0}%`;
          document.getElementById("m-ram").innerText = `${s.ram_used_mb || 0} / 8192 MB`;
          document.getElementById("m-disk").innerText = `${s.disk_used_mb || 0} / 20480 MB`;

          document.getElementById("set-name").value = s.name;
          document.getElementById("set-startup").value = s.startup_file;
          document.getElementById("set-reqs").value = s.requirements_file;
        }
      } catch (e) {}
    }

    async function powerAction(action) {
      if (!ACTIVE_SERVER_ID) return;
      try {
        const res = await fetch(`/api/${action}/${ACTIVE_SERVER_ID}`, { method: "POST" });
        const data = await res.json();
        showToast(data.message, data.status !== "success");
        refreshActiveServerData();
      } catch (err) {
        showToast(`Action failed`, true);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
      document.querySelectorAll(".panel-nav button").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).style.display = "block";

      const navBtn = Array.from(document.querySelectorAll(".panel-nav button")).find(b => b.getAttribute("onclick").includes(tabId));
      if (navBtn) navBtn.classList.add("active");

      if (LOG_TIMER) clearInterval(LOG_TIMER);

      if (tabId === 'tab-console') {
        fetchLogs();
        LOG_TIMER = setInterval(fetchLogs, 2500);
      } else if (tabId === 'tab-files') {
        CURRENT_FILE_PATH = "";
        loadFiles("");
      }
    }

    async function fetchLogs() {
      if (!ACTIVE_SERVER_ID) return;
      try {
        const res = await fetch(`/api/logs/${ACTIVE_SERVER_ID}`);
        const data = await res.json();
        if (data.status === "success") {
          const t = document.getElementById("terminal-box");
          t.innerText = data.logs || "Console ready.";
          t.scrollTop = t.scrollHeight;
        }
      } catch (e) {}
    }

    async function clearLogs() {
      if (!ACTIVE_SERVER_ID) return;
      await fetch(`/api/clear_logs/${ACTIVE_SERVER_ID}`, { method: "POST" });
      fetchLogs();
    }

    async function sendCommand(e) {
      e.preventDefault();
      const input = document.getElementById("term-input");
      const cmd = input.value.trim();
      if (!cmd || !ACTIVE_SERVER_ID) return;
      input.value = "";

      try {
        const res = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ server_id: ACTIVE_SERVER_ID, command: cmd })
        });
        const d = await res.json();
        if (d.status === "success") fetchLogs();
        else showToast(d.message, true);
      } catch (err) {
        showToast("Error sending command", true);
      }
    }

    async function loadFiles(path = "") {
      CURRENT_FILE_PATH = path;
      document.getElementById("fm-path").innerText = path ? `root/${path}` : "root";
      try {
        const res = await fetch(`/api/files/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`);
        const data = await res.json();
        const tbody = document.getElementById("files-list");
        tbody.innerHTML = "";

        if (path) {
          const parent = path.includes("/") ? path.substring(0, path.lastIndexOf("/")) : "";
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="3"><span class="file-name-click" onclick="loadFiles('${parent}')">📁 .. (Up)</span></td>`;
          tbody.appendChild(tr);
        }

        data.files.forEach(item => {
          const itemPath = path ? `${path}/${item.name}` : item.name;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <span class="file-name-click" onclick="handleItemClick('${itemPath}', ${item.is_dir})">
                ${item.is_dir ? '📁' : '📄'} ${escapeHtml(item.name)}
              </span>
            </td>
            <td style="color: var(--stat-title);">${item.is_dir ? '-' : formatBytes(item.size)}</td>
            <td style="text-align: right;">
              ${!item.is_dir ? `<button class="btn-secondary" style="padding: 2px 6px; font-size: 0.75rem;" onclick="editFile('${itemPath}')">Edit</button>` : ''}
              <button class="btn-secondary" style="padding: 2px 6px; font-size: 0.75rem; color: #ef4444;" onclick="deleteFileItem('${itemPath}')">✕</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {}
    }

    function handleItemClick(path, isDir) {
      if (isDir) loadFiles(path);
      else editFile(path);
    }

    async function editFile(path) {
      EDITING_TARGET = path;
      const res = await fetch(`/api/file/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("edit-file-name").innerText = `Edit: ${path}`;
        document.getElementById("edit-file-content").value = data.content;
        document.getElementById("modal-editor").classList.add("open");
      }
    }

    async function saveFileContent() {
      const content = document.getElementById("edit-file-content").value;
      const res = await fetch(`/api/file/${ACTIVE_SERVER_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: EDITING_TARGET, content: content })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      closeEditorModal();
      loadFiles(CURRENT_FILE_PATH);
    }

    async function uploadSelectedFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("path", CURRENT_FILE_PATH);
      const res = await fetch(`/api/upload/${ACTIVE_SERVER_ID}`, { method: "POST", body: formData });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(CURRENT_FILE_PATH);
      e.target.value = "";
    }

    async function createFolderPrompt() {
      const name = prompt("Folder Name:");
      if (!name) return;
      const res = await fetch(`/api/create_folder/${ACTIVE_SERVER_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: CURRENT_FILE_PATH, name: name })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(CURRENT_FILE_PATH);
    }

    async function deleteFileItem(path) {
      if (!confirm(`Delete ${path}?`)) return;
      const res = await fetch(`/api/file/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`, { method: "DELETE" });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(CURRENT_FILE_PATH);
    }

    function closeEditorModal() { document.getElementById("modal-editor").classList.remove("open"); }

    async function saveServerSettings(e) {
      e.preventDefault();
      const name = document.getElementById("set-name").value.trim();
      const startup = document.getElementById("set-startup").value.trim();
      const reqs = document.getElementById("set-reqs").value.trim();

      const res = await fetch(`/api/server/${ACTIVE_SERVER_ID}/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, startup_file: startup, requirements_file: reqs })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      refreshActiveServerData();
    }

    async function deleteActiveServer() {
      if (!confirm("Are you sure you want to delete this server?")) return;
      const res = await fetch(`/api/server/${ACTIVE_SERVER_ID}`, { method: "DELETE" });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      backToServers();
    }

    function openCreateModal() { document.getElementById("modal-create").classList.add("open"); }
    function closeCreateModal() { document.getElementById("modal-create").classList.remove("open"); }

    async function createServerSubmit(e) {
      e.preventDefault();
      const name = document.getElementById("create-name").value.trim();
      if (!name) return;

      const res = await fetch("/api/create_server", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name })
      });
      const d = await res.json();
      if (d.status === "success") {
        showToast(d.message);
        closeCreateModal();
        document.getElementById("create-name").value = "";
        loadServers();
      } else {
        showToast(d.message, true);
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    window.addEventListener("DOMContentLoaded", loadServers);
  </script>
</body>
</html>
