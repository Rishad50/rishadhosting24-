<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Servers</title>
  
  <!-- Google Fonts: স্ক্রিনশটের হুবহু ফন্ট -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       আপনার দেওয়া নিখুঁত Text Size এবং Color সেটিংস
       ========================================================== */
    :root {
      /* Font Sizes */
      --header-title-size: 26px;     /* 'My Servers' */
      --create-btn-size: 15px;       /* '+ CREATE' */
      --server-title-size: 19px;     /* 'Testing' */
      --server-id-size: 13.5px;      /* 'testing_1779785743' */
      --status-badge-size: 11.5px;   /* 'OFFLINE' */

      /* Exact Colors */
      --bg-color: #000000;           /* সম্পূর্ণ পিচ ব্ল্যাক ব্যাকগ্রাউন্ড */
      --card-bg: #0e0f13;            /* কার্ডের আসল ডার্ক গ্রে কালার */
      --card-border: #1a1b22;        /* কার্ডের চারপাশের সূক্ষ্ম বর্ডার */
      --purple-btn: #9d5cd2;         /* পারফেক্ট পার্পল কালার */
      --purple-hover: #8945bf;
      --text-white: #ffffff;         /* হেডিং ও টাইটেলের জন্য */
      --text-muted: #5e606b;         /* আইডি এবং অফলাইন টেক্সটের ছাই রঙ */
      --badge-bg: #1a1b22;           /* অফলাইন ব্যাজের ব্যাকগ্রাউন্ড */
      
      /* Active / Online Colors */
      --online-green: #22c55e;
      --badge-online-bg: #11241a;
      --progress-track: #1a1b26;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-white);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      min-height: 100vh;
    }

    /* স্ক্রিনের উইডথ ও কন্টেইনার */
    .wrapper {
      width: 100%;
      max-width: 480px; /* মোবাইল রেশিও অনুযায়ী */
    }

    /* TOAST ALERT */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 12px;
      background: #14151c;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--purple-btn);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: auto;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ১. হেডার পার্ট */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .title {
      font-size: var(--header-title-size);
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* '+ CREATE' বাটন */
    .create-button {
      background-color: var(--purple-btn);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 10px 20px;
      border-radius: 16px; /* সফট রাউন্ডেড শেপ */
      font-size: var(--create-btn-size);
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .create-button:hover { opacity: 0.9; }
    .create-button:active { transform: scale(0.97); }

    .plus-symbol {
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
      margin-top: -1px;
    }

    /* ২. সার্ভার কার্ড লিস্ট */
    .servers-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .server-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px; /* বড় কার্ভড কর্নার */
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .server-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* বাম পাশের সার্ভার ইনফো */
    .server-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .server-name {
      font-size: var(--server-title-size);
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.2;
    }

    .server-id {
      font-family: 'Roboto Mono', ui-monospace, monospace; /* আইডির জন্য মোনোস্পেস */
      font-size: var(--server-id-size);
      color: var(--text-muted);
      letter-spacing: -0.3px;
    }

    /* ৩. ব্যাজ (অফলাইন / অনলাইন) */
    .status-badge {
      background-color: var(--badge-bg);
      padding: 6px 14px;
      border-radius: 30px; /* সম্পূর্ণ পিল শেপ */
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .status-badge.online {
      background-color: var(--badge-online-bg);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }
    .status-badge.online .status-dot {
      background-color: var(--online-green);
    }

    .status-text {
      font-size: var(--status-badge-size);
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      line-height: 1;
    }
    .status-badge.online .status-text {
      color: var(--online-green);
    }

    /* ৪. রিসোর্স বার (CPU, RAM, DISK) */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 2px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-muted);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-label svg {
      width: 13px;
      height: 13px;
      fill: var(--text-muted);
    }

    .stat-value {
      color: #cfcfe0;
      font-family: 'Roboto Mono', monospace;
    }

    .progress-track {
      width: 100%;
      height: 3.5px;
      background: var(--progress-track);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--purple-btn);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-fill.blue { background: #38bdf8; }

    /* ৫. Manage Server বোতাম */
    .manage-btn {
      background: var(--purple-btn);
      color: #fff;
      border: none;
      width: 100%;
      padding: 13px 0;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s ease;
    }
    .manage-btn:hover { opacity: 0.9; }

    /* ৬. ম্যানেজমেন্ট ভিউ (Dashboard/Console/Files/Settings) */
    .view-section { display: none; }
    .view-section.active { display: block; }

    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
    }
    .tab-btn {
      background: #14151d;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--purple-btn);
      color: #fff;
      border-color: var(--purple-btn);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-action {
      padding: 11px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
    }
    .btn-start { background: #16a34a; }
    .btn-stop { background: #dc2626; }
    .btn-restart { background: #7c3aed; }

    /* টার্মিনাল / কনসোল */
    .terminal {
      background: #050508;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      height: 380px;
      padding: 14px;
      color: #22c55e;
      font-family: 'Roboto Mono', monospace;
      font-size: 12.5px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .cmd-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .cmd-input {
      flex-grow: 1;
      background: #08080d;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      outline: none;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
    }

    /* ফাইল ম্যানেজার টেবিল */
    .file-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    .file-table th, .file-table td {
      padding: 10px 6px;
      text-align: left;
      border-bottom: 1px solid #161720;
    }
    .file-table th { color: var(--text-muted); font-size: 12px; }
    .file-click { cursor: pointer; color: #fff; font-weight: 600; }
    .file-click:hover { color: var(--purple-btn); }

    /* মোডাল */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .input-field {
      width: 100%;
      background: #08080c;
      border: 1px solid var(--card-border);
      padding: 11px 14px;
      border-radius: 12px;
      color: #fff;
      margin: 8px 0 16px 0;
      outline: none;
      font-size: 14px;
    }
    .input-field:focus { border-color: var(--purple-btn); }
    .btn-secondary {
      background: #191a24;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="wrapper">

    <!-- ================= ১. MY SERVERS (স্ক্রিনশটের হুবহু লুক) ================= -->
    <div id="view-home" class="view-section active">
      <!-- Header -->
      <div class="header-row">
        <h1 class="title">My Servers</h1>
        <button class="create-button" onclick="openCreateModal()">
          <span class="plus-symbol">+</span> CREATE
        </button>
      </div>

      <!-- Server Cards List -->
      <div id="servers-container" class="servers-list">
        <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ড লোড হবে -->
      </div>
    </div>


    <!-- ================= ২. SERVER MANAGEMENT ================= -->
    <div id="view-dashboard" class="view-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="btn-secondary" onclick="backToHome()">← Back</button>
        <span id="nav-server-title" style="font-weight: 800; font-size: 15px;"></span>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('tab-overview')">Overview</button>
        <button class="tab-btn" onclick="switchTab('tab-console')">Console</button>
        <button class="tab-btn" onclick="switchTab('tab-files')">Files</button>
        <button class="tab-btn" onclick="switchTab('tab-settings')">Settings</button>
      </div>

      <!-- OVERVIEW -->
      <div id="tab-overview" class="tab-content">
        <div class="panel-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="server-info">
              <div class="server-name" id="d-name">Server</div>
              <div class="server-id" id="d-id">id</div>
            </div>
            <div id="d-badge" class="status-badge">
              <span class="status-dot"></span>
              <span id="d-status-text" class="status-text">OFFLINE</span>
            </div>
          </div>

          <div class="action-grid">
            <button class="btn-action btn-start" onclick="power('start')">Start</button>
            <button class="btn-action btn-stop" onclick="power('stop')">Stop</button>
            <button class="btn-action btn-restart" onclick="power('restart')">Restart</button>
          </div>
        </div>

        <div class="panel-card">
          <h4 style="margin-bottom: 12px; font-size: 13px; color: var(--text-muted);">Allocated Resources</h4>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: #08080c; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border);">
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 800;">CPU</span>
              <h3 id="d-cpu" style="margin-top: 4px; font-family: 'Roboto Mono', monospace;">0%</h3>
            </div>
            <div style="background: #08080c; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border);">
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 800;">RAM</span>
              <h3 id="d-ram" style="margin-top: 4px; font-family: 'Roboto Mono', monospace; font-size: 14px;">0 / 8192 MB</h3>
            </div>
            <div style="background: #08080c; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); grid-column: span 2;">
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 800;">DISK</span>
              <h3 id="d-disk" style="margin-top: 4px; font-family: 'Roboto Mono', monospace; font-size: 14px;">0 / 20480 MB</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- CONSOLE -->
      <div id="tab-console" class="tab-content" style="display: none;">
        <div class="panel-card" style="padding: 14px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 12px; color: var(--text-muted); font-weight: 800;">LIVE TERMINAL</span>
            <button class="btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="clearLogs()">Clear</button>
          </div>
          <div id="terminal" class="terminal">Loading logs...</div>
          <form class="cmd-bar" onsubmit="sendCmd(event)">
            <input type="text" id="cmd-input" class="cmd-input" placeholder="Type command..." autocomplete="off">
            <button type="submit" class="create-button" style="padding: 0 16px; border-radius: 12px;">Send</button>
          </form>
        </div>
      </div>

      <!-- FILES -->
      <div id="tab-files" class="tab-content" style="display: none;">
        <div class="panel-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span id="fm-current-path" style="font-size: 12px; color: var(--purple-btn); font-family: 'Roboto Mono', monospace;">root</span>
            <div style="display: flex; gap: 6px;">
              <input type="file" id="fm-upload" style="display: none;" onchange="uploadFile(event)">
              <button class="btn-secondary" style="font-size: 12px;" onclick="document.getElementById('fm-upload').click()">↑ Upload</button>
              <button class="btn-secondary" style="font-size: 12px;" onclick="newFolderPrompt()">+ Folder</button>
            </div>
          </div>

          <table class="file-table">
            <thead>
              <tr><th>Name</th><th>Size</th><th style="text-align: right;">Action</th></tr>
            </thead>
            <tbody id="files-list"></tbody>
          </table>
        </div>
      </div>

      <!-- SETTINGS -->
      <div id="tab-settings" class="tab-content" style="display: none;">
        <div class="panel-card">
          <h3 style="margin-bottom: 14px; font-size: 16px;">Server Settings</h3>
          <form onsubmit="saveSettings(event)">
            <label style="font-size: 12px; color: var(--text-muted); font-weight: 700;">Server Name</label>
            <input type="text" id="s-name" class="input-field" required>

            <label style="font-size: 12px; color: var(--text-muted); font-weight: 700;">Startup Script</label>
            <input type="text" id="s-startup" class="input-field" required>

            <label style="font-size: 12px; color: var(--text-muted); font-weight: 700;">Requirements File</label>
            <input type="text" id="s-reqs" class="input-field" required>

            <button type="submit" class="manage-btn">Save Changes</button>
          </form>

          <hr style="border: none; border-top: 1px solid var(--card-border); margin: 24px 0 16px 0;">

          <button class="btn-secondary" style="background: #dc2626; width: 100%; font-weight: 800;" onclick="deleteCurrentServer()">
            Delete Server Permanently
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL: CREATE SERVER -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px; font-size: 18px;">Create New Server</h3>
      <form onsubmit="handleCreate(event)">
        <label style="font-size: 12px; color: var(--text-muted); font-weight: 700;">SERVER NAME</label>
        <input type="text" id="c-name" class="input-field" placeholder="e.g. Testing" required>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
          <button type="submit" class="create-button">
            <span class="plus-symbol">+</span> CREATE
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: FILE EDITOR -->
  <div id="modal-editor" class="modal-overlay">
    <div class="modal-card" style="max-width: 600px;">
      <h3 id="edit-filename" style="margin-bottom: 12px; font-size: 16px;">Edit File</h3>
      <textarea id="edit-content" class="input-field" style="height: 320px; font-family: 'Roboto Mono', monospace; font-size: 13px;"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="btn-secondary" onclick="closeEditorModal()">Cancel</button>
        <button type="button" class="create-button" onclick="saveEditedFile()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let ACTIVE_ID = null;
    let FM_PATH = "";
    let EDIT_PATH = "";
    let LOG_TIMER = null;

    function showToast(msg, isErr = false) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast";
      if (isErr) t.style.borderLeftColor = "#ef4444";
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    async function loadServers() {
      try {
        const res = await fetch("/api/servers");
        const data = await res.json();
        if (data.status === "success") {
          renderCards(data.servers);
        }
      } catch (e) {
        showToast("Connection error", true);
      }
    }

    function renderCards(servers) {
      const container = document.getElementById("servers-container");
      container.innerHTML = "";

      const keys = Object.keys(servers);
      if (keys.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 16px; color: var(--text-muted); border: 1px dashed var(--card-border); border-radius: 20px;">
            <p style="font-weight: 700;">No servers created yet.</p>
          </div>
        `;
        return;
      }

      keys.forEach(id => {
        const s = servers[id];
        const isOnline = s.status === "running";
        const ramUsed = s.ram_used_mb || 0;
        const ramMax = s.ram_max_mb || 8192;
        const ramPct = Math.min(100, Math.round((ramUsed / ramMax) * 100));

        const diskUsed = s.disk_used_mb || 0;
        const diskMax = s.disk_max_mb || 20480;
        const diskPct = Math.min(100, Math.round((diskUsed / diskMax) * 100));

        const card = document.createElement("div");
        card.className = "server-card";
        card.innerHTML = `
          <!-- আপনার স্ক্রিনশটের হুবহু লেআউট -->
          <div class="server-card-top">
            <div class="server-info">
              <div class="server-name">${escapeHtml(s.name)}</div>
              <div class="server-id">${escapeHtml(s.id)}</div>
            </div>
            <div class="status-badge ${isOnline ? 'online' : ''}">
              <span class="status-dot"></span>
              <span class="status-text">${isOnline ? 'ONLINE' : 'OFFLINE'}</span>
            </div>
          </div>

          <!-- রিসোর্স স্ট্যাটাস -->
          <div class="stats-container">
            <div class="stat-row">
              <div class="stat-meta">
                <span class="stat-label">
                  <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6V4zm2 2v12h8V6H8zm-4 3H2v2h2V9zm0 4H2v2h2v-2zm18-4h-2v2h2V9zm0 4h-2v2h2v-2zM9 2h2v2H9V2zm4 0h2v2h-2V2zm-4 18h2v2H9v-2zm4 0h2v2h-2v-2z"/></svg>
                  CPU
                </span>
                <span class="stat-value">${s.cpu_percent || 0}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width: ${Math.min(100, s.cpu_percent || 0)}%"></div>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-meta">
                <span class="stat-label">
                  <svg viewBox="0 0 24 24"><path d="M2 7h20v10H2V7zm2 2v6h16V9H4zm2 1h2v4H6v-4zm4 0h2v4h-2v-4zm4 0h2v4h-2v-4z"/></svg>
                  RAM
                </span>
                <span class="stat-value">${ramUsed} / ${ramMax} MB</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill blue" style="width: ${ramPct}%"></div>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-meta">
                <span class="stat-label">
                  <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v7h16V6H4zm0 9v3h16v-3H4zm13 1h2v1h-2v-1z"/></svg>
                  DISK
                </span>
                <span class="stat-value">${diskUsed} / ${diskMax} MB</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width: ${diskPct}%"></div>
              </div>
            </div>
          </div>

          <button class="manage-btn" onclick="openDashboard('${s.id}')">
            Manage server ➔
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Dashboard Controller
    async function openDashboard(id) {
      ACTIVE_ID = id;
      document.getElementById("view-home").classList.remove("active");
      document.getElementById("view-dashboard").classList.add("active");
      switchTab('tab-overview');
      refreshDashboard();
    }

    function backToHome() {
      if (LOG_TIMER) clearInterval(LOG_TIMER);
      document.getElementById("view-dashboard").classList.remove("active");
      document.getElementById("view-home").classList.add("active");
      loadServers();
    }

    async function refreshDashboard() {
      if (!ACTIVE_ID) return;
      const res = await fetch(`/api/server/${ACTIVE_ID}`);
      const data = await res.json();
      if (data.status === "success") {
        const s = data.server;
        document.getElementById("nav-server-title").innerText = s.name;
        document.getElementById("d-name").innerText = s.name;
        document.getElementById("d-id").innerText = s.id;

        const isOnline = s.status === "running";
        const badge = document.getElementById("d-badge");
        badge.className = `status-badge ${isOnline ? 'online' : ''}`;
        document.getElementById("d-status-text").innerText = isOnline ? "ONLINE" : "OFFLINE";

        document.getElementById("d-cpu").innerText = `${s.cpu_percent || 0}%`;
        document.getElementById("d-ram").innerText = `${s.ram_used_mb || 0} / 8192 MB`;
        document.getElementById("d-disk").innerText = `${s.disk_used_mb || 0} / 20480 MB`;

        document.getElementById("s-name").value = s.name;
        document.getElementById("s-startup").value = s.startup_file;
        document.getElementById("s-reqs").value = s.requirements_file;
      }
    }

    async function power(action) {
      if (!ACTIVE_ID) return;
      const res = await fetch(`/api/${action}/${ACTIVE_ID}`, { method: "POST" });
      const data = await res.json();
      showToast(data.message, data.status !== "success");
      refreshDashboard();
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).style.display = "block";

      const btn = Array.from(document.querySelectorAll(".tab-btn")).find(b => b.getAttribute("onclick").includes(tabId));
      if (btn) btn.classList.add("active");

      if (LOG_TIMER) clearInterval(LOG_TIMER);

      if (tabId === 'tab-console') {
        fetchLogs();
        LOG_TIMER = setInterval(fetchLogs, 2500);
      } else if (tabId === 'tab-files') {
        FM_PATH = "";
        loadFiles("");
      }
    }

    // Console
    async function fetchLogs() {
      if (!ACTIVE_ID) return;
      const res = await fetch(`/api/logs/${ACTIVE_ID}`);
      const data = await res.json();
      if (data.status === "success") {
        const t = document.getElementById("terminal");
        t.innerText = data.logs || "Console ready.";
        t.scrollTop = t.scrollHeight;
      }
    }

    async function clearLogs() {
      if (!ACTIVE_ID) return;
      await fetch(`/api/clear_logs/${ACTIVE_ID}`, { method: "POST" });
      fetchLogs();
    }

    async function sendCmd(e) {
      e.preventDefault();
      const input = document.getElementById("cmd-input");
      const cmd = input.value.trim();
      if (!cmd || !ACTIVE_ID) return;
      input.value = "";

      const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ server_id: ACTIVE_ID, command: cmd })
      });
      fetchLogs();
    }

    // Files
    async function loadFiles(path = "") {
      FM_PATH = path;
      document.getElementById("fm-current-path").innerText = path ? `root/${path}` : "root";
      const res = await fetch(`/api/files/${ACTIVE_ID}?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      const tbody = document.getElementById("files-list");
      tbody.innerHTML = "";

      if (path) {
        const parent = path.includes("/") ? path.substring(0, path.lastIndexOf("/")) : "";
        tbody.innerHTML += `<tr><td colspan="3"><span class="file-click" onclick="loadFiles('${parent}')">📁 .. (Back)</span></td></tr>`;
      }

      data.files.forEach(f => {
        const p = path ? `${path}/${f.name}` : f.name;
        tbody.innerHTML += `
          <tr>
            <td><span class="file-click" onclick="${f.is_dir ? `loadFiles('${p}')` : `editFile('${p}')`}">${f.is_dir ? '📁' : '📄'} ${escapeHtml(f.name)}</span></td>
            <td style="color: var(--text-muted); font-family: 'Roboto Mono', monospace;">${f.is_dir ? '-' : formatBytes(f.size)}</td>
            <td style="text-align: right;">
              ${!f.is_dir ? `<button class="btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="editFile('${p}')">Edit</button>` : ''}
              <button class="btn-secondary" style="padding: 2px 8px; font-size: 11px; color: #ef4444;" onclick="deleteFile('${p}')">✕</button>
            </td>
          </tr>
        `;
      });
    }

    async function editFile(p) {
      EDIT_PATH = p;
      const res = await fetch(`/api/file/${ACTIVE_ID}?path=${encodeURIComponent(p)}`);
      const d = await res.json();
      if (d.status === "success") {
        document.getElementById("edit-filename").innerText = `Edit: ${p}`;
        document.getElementById("edit-content").value = d.content;
        document.getElementById("modal-editor").classList.add("open");
      }
    }

    async function saveEditedFile() {
      const content = document.getElementById("edit-content").value;
      const res = await fetch(`/api/file/${ACTIVE_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: EDIT_PATH, content: content })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      closeEditorModal();
      loadFiles(FM_PATH);
    }

    async function uploadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("path", FM_PATH);
      const res = await fetch(`/api/upload/${ACTIVE_ID}`, { method: "POST", body: fd });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(FM_PATH);
      e.target.value = "";
    }

    async function newFolderPrompt() {
      const name = prompt("Folder Name:");
      if (!name) return;
      const res = await fetch(`/api/create_folder/${ACTIVE_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: FM_PATH, name: name })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(FM_PATH);
    }

    async function deleteFile(p) {
      if (!confirm(`Delete ${p}?`)) return;
      const res = await fetch(`/api/file/${ACTIVE_ID}?path=${encodeURIComponent(p)}`, { method: "DELETE" });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      loadFiles(FM_PATH);
    }

    function closeEditorModal() { document.getElementById("modal-editor").classList.remove("open"); }

    // Settings
    async function saveSettings(e) {
      e.preventDefault();
      const res = await fetch(`/api/server/${ACTIVE_ID}/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("s-name").value.trim(),
          startup_file: document.getElementById("s-startup").value.trim(),
          requirements_file: document.getElementById("s-reqs").value.trim()
        })
      });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      refreshDashboard();
    }

    async function deleteCurrentServer() {
      if (!confirm("Are you sure? All files and logs will be erased.")) return;
      const res = await fetch(`/api/server/${ACTIVE_ID}`, { method: "DELETE" });
      const d = await res.json();
      showToast(d.message, d.status !== "success");
      backToHome();
    }

    // Modal
    function openCreateModal() { document.getElementById("modal-create").classList.add("open"); }
    function closeCreateModal() { document.getElementById("modal-create").classList.remove("open"); }

    async function handleCreate(e) {
      e.preventDefault();
      const name = document.getElementById("c-name").value.trim();
      if (!name) return;

      const res = await fetch("/api/create_server", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name })
      });
      const d = await res.json();
      if (d.status === "success") {
        showToast(d.message);
        closeCreateModal();
        document.getElementById("c-name").value = "";
        loadServers();
      } else {
        showToast(d.message, true);
      }
    }

    function escapeHtml(s) {
      return (s || "").replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
    function formatBytes(b) {
      if (!b) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(k));
      return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    window.addEventListener("DOMContentLoaded", loadServers);
  </script>
</body>
</html>
