<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Servers</title>
  <style>
    :root {
      --bg-color: #0c0d12;
      --card-bg: #14161f;
      --card-border: #1f2230;
      --purple: #9d5ce5;
      --purple-hover: #b072f5;
      --text-white: #ffffff;
      --text-muted: #858c9f;
      --online-bg: #10261c;
      --online-text: #22c55e;
      --offline-bg: #1f232f;
      --offline-text: #8e95a5;
      --danger: #ef4444;
      --progress-bg: #1d2130;
      --radius-card: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* TOAST */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      background: #1c202d;
      color: #fff;
      border-left: 4px solid var(--purple);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      animation: fadeIn 0.25s ease;
    }
    .toast.success { border-left-color: var(--online-text); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* HEADER */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .top-header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .btn-create {
      background-color: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-create:hover { background-color: var(--purple-hover); }
    .btn-create:active { transform: scale(0.97); }

    /* CARDS */
    .server-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 22px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .server-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .server-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .server-icon {
      width: 48px;
      height: 48px;
      background: #201e33;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bb86fc;
      font-size: 1.4rem;
    }
    .server-name {
      font-size: 1.12rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .server-id {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .badge-status {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-status.offline {
      background: var(--offline-bg);
      color: var(--offline-text);
    }
    .badge-status.online {
      background: var(--online-bg);
      color: var(--online-text);
    }

    /* METRIC ROWS */
    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .metric-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .metric-value {
      color: var(--text-white);
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background-color: var(--progress-bg);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 2px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #60a5fa;
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* MANAGE BUTTON */
    .btn-manage {
      width: 100%;
      background-color: var(--purple);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-manage:hover { background-color: var(--purple-hover); }
    .btn-manage:active { transform: scale(0.98); }

    /* VIEW SWITCHER */
    .view-page { display: none; }
    .view-page.active { display: block; }

    /* DETAILS VIEW (DASHBOARD/FILES/CONSOLE) */
    .back-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .back-nav:hover { color: #fff; }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-action {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-stop { background: var(--danger); color: #fff; }
    .btn-restart { background: #7c3aed; color: #fff; }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #1c202e;
      color: #fff;
    }

    .terminal-box {
      background: #08090d;
      border: 1px solid #1c202e;
      border-radius: 14px;
      padding: 14px;
      height: 360px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #00ff88;
      white-space: pre-wrap;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .cmd-row {
      display: flex;
      gap: 8px;
    }
    .cmd-input {
      flex: 1;
      background: #12141c;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-family: monospace;
      outline: none;
    }
    .cmd-input:focus { border-color: var(--purple); }

    /* FILE MANAGER TABLE */
    .fm-list {
      background: #0f1118;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .fm-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #181b26;
      font-size: 0.9rem;
    }
    .fm-row:last-child { border-bottom: none; }
    .fm-name {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .fm-name:hover { color: var(--purple); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .modal-content input, .modal-content textarea {
      width: 100%;
      background: #0d0f15;
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      margin: 12px 0 20px 0;
      outline: none;
      font-size: 0.95rem;
    }
    .modal-content input:focus, .modal-content textarea:focus { border-color: var(--purple); }
  </style>
</head>
<body>

  <!-- NOTIFICATIONS -->
  <div id="toast-container"></div>

  <div class="container">

    <!-- ================= VIEW 1: MY SERVERS (MATCHING SCREENSHOT) ================= -->
    <div id="view-my-servers" class="view-page active">
      <div class="top-header">
        <h1>My Servers</h1>
        <button class="btn-create" onclick="openCreateModal()">+ CREATE</button>
      </div>

      <div id="servers-list">
        <!-- Server cards will be injected dynamically -->
      </div>
    </div>


    <!-- ================= VIEW 2: SERVER DETAIL / MANAGE ================= -->
    <div id="view-server-manage" class="view-page">
      <div class="back-nav" onclick="switchView('my-servers')">
        <span>←</span> Back to Servers
      </div>

      <div class="server-card" style="margin-bottom: 16px;">
        <div class="server-card-top">
          <div class="server-brand">
            <div class="server-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            </div>
            <div>
              <div class="server-name" id="manage-name">SERVER</div>
              <div class="server-id" id="manage-id">#00000000</div>
            </div>
          </div>
          <div id="manage-badge" class="badge-status offline">Offline</div>
        </div>

        <div class="action-grid" style="margin-top: 10px;">
          <button class="btn-action btn-start" onclick="startActiveServer()">▶ Start</button>
          <button class="btn-action btn-stop" onclick="stopActiveServer()">■ Stop</button>
          <button class="btn-action btn-restart" onclick="restartActiveServer()">↻ Restart</button>
        </div>
      </div>

      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('console')">Console</button>
        <button class="tab-btn" onclick="switchTab('files')">Files</button>
        <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
      </div>

      <!-- TAB: CONSOLE -->
      <div id="tab-console" class="tab-content">
        <div id="console-terminal" class="terminal-box">Connecting to log stream...</div>
        <form class="cmd-row" onsubmit="sendCommand(event)">
          <input type="text" id="cmd-input" class="cmd-input" placeholder="Enter command..." autocomplete="off">
          <button type="submit" class="btn-create" style="padding: 10px 16px;">Send</button>
        </form>
      </div>

      <!-- TAB: FILES -->
      <div id="tab-files" class="tab-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
          <span id="breadcrumb" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;" onclick="loadFiles('')">root</span>
          <div style="display: flex; gap: 8px;">
            <input type="file" id="file-uploader" style="display: none;" onchange="uploadFile(event)">
            <button class="btn-create" style="padding: 6px 12px; font-size: 0.8rem;" onclick="document.getElementById('file-uploader').click()">Upload</button>
            <button class="btn-create" style="padding: 6px 12px; font-size: 0.8rem; background: #232838;" onclick="newFolder()">+ Folder</button>
          </div>
        </div>
        <div class="fm-list" id="files-tbody">
          <!-- Files list -->
        </div>
      </div>

      <!-- TAB: SETTINGS -->
      <div id="tab-settings" class="tab-content" style="display: none;">
        <div class="server-card">
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">SERVER NAME</label>
          <input type="text" id="set-name" class="cmd-input" style="margin: 6px 0 14px 0;">

          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">STARTUP FILE</label>
          <input type="text" id="set-startup" class="cmd-input" style="margin: 6px 0 14px 0;">

          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">REQUIREMENTS FILE</label>
          <input type="text" id="set-reqs" class="cmd-input" style="margin: 6px 0 16px 0;">

          <button class="btn-manage" onclick="saveSettings()">Save Settings</button>
          <button class="btn-manage" style="background: var(--danger); margin-top: 10px;" onclick="deleteActiveServer()">Delete Server</button>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL: CREATE SERVER -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-content">
      <h2 style="font-size: 1.3rem; margin-bottom: 8px;">Create New Server</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Enter your bot/server name below:</p>
      <input type="text" id="create-name" placeholder="e.g. FLEX ROSE BOT">
      <div style="display: flex; gap: 10px;">
        <button class="btn-manage" style="background: #232838;" onclick="closeModal('modal-create')">Cancel</button>
        <button class="btn-manage" onclick="submitCreateServer()">Create</button>
      </div>
    </div>
  </div>

  <!-- MODAL: FILE EDITOR -->
  <div id="modal-editor" class="modal-overlay">
    <div class="modal-content" style="max-width: 580px;">
      <h3 id="editor-title" style="margin-bottom: 8px;">Edit File</h3>
      <textarea id="editor-text" style="height: 320px; font-family: monospace; font-size: 0.85rem;"></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn-manage" style="background: #232838;" onclick="closeModal('modal-editor')">Cancel</button>
        <button class="btn-manage" onclick="saveActiveFile()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let ACTIVE_SERVER_ID = null;
    let ACTIVE_FILE_PATH = "";
    let LOG_TIMER = null;

    function toast(msg, type = "success") {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    function switchView(view) {
      document.querySelectorAll(".view-page").forEach(el => el.classList.remove("active"));
      document.getElementById(`view-${view}`).classList.add("active");
      if (view === "my-servers") {
        if (LOG_TIMER) clearInterval(LOG_TIMER);
        loadServers();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
      event.target.classList.add("active");
      document.getElementById(`tab-${tab}`).style.display = "block";

      if (tab === "console") {
        fetchLogs();
        if (!LOG_TIMER) LOG_TIMER = setInterval(fetchLogs, 2500);
      } else {
        if (LOG_TIMER) clearInterval(LOG_TIMER);
      }
      if (tab === "files") loadFiles();
    }

    function openCreateModal() {
      document.getElementById("create-name").value = "";
      document.getElementById("modal-create").classList.add("open");
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    // ==================== LOAD SERVERS (EXACT UI) ====================
    async function loadServers() {
      try {
        const res = await fetch("/api/servers");
        const data = await res.json();
        const list = document.getElementById("servers-list");
        list.innerHTML = "";

        const keys = Object.keys(data.servers || {});
        if (keys.length === 0) {
          list.innerHTML = `
            <div style="text-align: center; padding: 40px 10px; color: var(--text-muted);">
              No servers available. Click <b>+ CREATE</b> to make one!
            </div>`;
          return;
        }

        keys.forEach(id => {
          const s = data.servers[id];
          const isOnline = s.status === "running";
          const ramPct = Math.min(100, Math.round((s.ram_used / s.ram_max) * 100));
          const diskPct = Math.min(100, Math.round((s.disk_used / s.disk_max) * 100));

          const card = document.createElement("div");
          card.className = "server-card";
          card.innerHTML = `
            <div class="server-card-top">
              <div class="server-brand">
                <div class="server-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                </div>
                <div>
                  <div class="server-name">${escapeHtml(s.name)}</div>
                  <div class="server-id">#${s.id}</div>
                </div>
              </div>
              <div class="badge-status ${isOnline ? 'online' : 'offline'}">${isOnline ? 'Online' : 'Offline'}</div>
            </div>

            <!-- CPU -->
            <div class="metric-item">
              <div class="metric-header">
                <span class="metric-label">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
                  CPU
                </span>
                <span class="metric-value">0%</span>
              </div>
            </div>

            <!-- RAM -->
            <div class="metric-item">
              <div class="metric-header">
                <span class="metric-label">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10h20"/><path d="M2 14h20"/><path d="M6 6v12"/><path d="M10 6v12"/><path d="M14 6v12"/><path d="M18 6v12"/></svg>
                  RAM
                </span>
                <span class="metric-value">${s.ram_used} / ${s.ram_max} MB</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${isOnline ? Math.max(ramPct, 2) : 0}%;"></div>
              </div>
            </div>

            <!-- DISK -->
            <div class="metric-item">
              <div class="metric-header">
                <span class="metric-label">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                  DISK
                </span>
                <span class="metric-value">${s.disk_used} / ${s.disk_max} MB</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${Math.max(diskPct, 1)}%;"></div>
              </div>
            </div>

            <button class="btn-manage" onclick="openServerManage('${s.id}')">
              Manage server ➔
            </button>
          `;
          list.appendChild(card);
        });
      } catch (e) {
        toast("Failed to load servers", "error");
      }
    }

    // ==================== CREATE SERVER ====================
    async function submitCreateServer() {
      const name = document.getElementById("create-name").value.trim();
      if (!name) return;

      const res = await fetch("/api/create_server", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (data.status === "success") {
        closeModal("modal-create");
        toast("Server created!");
        loadServers();
      } else {
        toast(data.message, "error");
      }
    }

    // ==================== MANAGE VIEW ====================
    async function openServerManage(serverId) {
      ACTIVE_SERVER_ID = serverId;
      const res = await fetch(`/api/server/${serverId}`);
      const data = await res.json();
      if (data.status === "success") {
        const s = data.server;
        document.getElementById("manage-name").innerText = s.name;
        document.getElementById("manage-id").innerText = `#${s.id}`;

        const isOnline = s.status === "running";
        const badge = document.getElementById("manage-badge");
        badge.className = `badge-status ${isOnline ? 'online' : 'offline'}`;
        badge.innerText = isOnline ? "Online" : "Offline";

        document.getElementById("set-name").value = s.name;
        document.getElementById("set-startup").value = s.startup_file;
        document.getElementById("set-reqs").value = s.requirements_file;

        switchView("server-manage");
        switchTab("console");
      }
    }

    async function startActiveServer() {
      const res = await fetch(`/api/start/${ACTIVE_SERVER_ID}`, { method: "POST" });
      const data = await res.json();
      toast(data.message, data.status);
      openServerManage(ACTIVE_SERVER_ID);
    }

    async function stopActiveServer() {
      const res = await fetch(`/api/stop/${ACTIVE_SERVER_ID}`, { method: "POST" });
      const data = await res.json();
      toast(data.message, data.status);
      openServerManage(ACTIVE_SERVER_ID);
    }

    async function restartActiveServer() {
      toast("Restarting...", "success");
      await fetch(`/api/restart/${ACTIVE_SERVER_ID}`, { method: "POST" });
      openServerManage(ACTIVE_SERVER_ID);
    }

    async function deleteActiveServer() {
      if (!confirm("Are you sure you want to delete this server completely?")) return;
      const res = await fetch(`/api/server/${ACTIVE_SERVER_ID}`, { method: "DELETE" });
      const data = await res.json();
      toast(data.message, data.status);
      switchView("my-servers");
    }

    // ==================== CONSOLE ====================
    async function fetchLogs() {
      if (!ACTIVE_SERVER_ID) return;
      try {
        const res = await fetch(`/api/logs/${ACTIVE_SERVER_ID}`);
        const data = await res.json();
        const box = document.getElementById("console-terminal");
        box.innerText = data.logs || "No logs.";
        box.scrollTop = box.scrollHeight;
      } catch (e) {}
    }

    async function sendCommand(e) {
      e.preventDefault();
      const input = document.getElementById("cmd-input");
      const cmd = input.value.trim();
      if (!cmd) return;
      input.value = "";
      await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ server_id: ACTIVE_SERVER_ID, command: cmd })
      });
      fetchLogs();
    }

    // ==================== FILE MANAGER ====================
    let CURRENT_PATH = "";
    async function loadFiles(path = CURRENT_PATH) {
      CURRENT_PATH = path;
      document.getElementById("breadcrumb").innerText = path ? `root/${path}` : "root";
      const res = await fetch(`/api/files/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      const tbody = document.getElementById("files-tbody");
      tbody.innerHTML = "";

      if (path) {
        const pRow = document.createElement("div");
        pRow.className = "fm-row";
        pRow.innerHTML = `<span class="fm-name" onclick="loadFiles('')">📁 .. (Up)</span>`;
        tbody.appendChild(pRow);
      }

      data.files.forEach(f => {
        const row = document.createElement("div");
        row.className = "fm-row";
        const fPath = CURRENT_PATH ? `${CURRENT_PATH}/${f.name}` : f.name;
        row.innerHTML = `
          <span class="fm-name" onclick="${f.is_dir ? `loadFiles('${fPath}')` : `openEditor('${fPath}')`}">
            ${f.is_dir ? '📁' : '📄'} ${escapeHtml(f.name)}
          </span>
          <div style="display:flex; gap:6px;">
            ${f.name.endsWith('.zip') ? `<button class="btn-create" style="padding:4px 8px; font-size:0.75rem;" onclick="extractZip('${fPath}')">Extract</button>` : ''}
            <button class="btn-create" style="padding:4px 8px; font-size:0.75rem; background: var(--danger);" onclick="deleteItem('${fPath}')">✕</button>
          </div>
        `;
        tbody.appendChild(row);
      });
    }

    async function openEditor(path) {
      ACTIVE_FILE_PATH = path;
      const res = await fetch(`/api/file/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      document.getElementById("editor-title").innerText = path;
      document.getElementById("editor-text").value = data.content;
      document.getElementById("modal-editor").classList.add("open");
    }

    async function saveActiveFile() {
      const content = document.getElementById("editor-text").value;
      const res = await fetch(`/api/file/${ACTIVE_SERVER_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: ACTIVE_FILE_PATH, content })
      });
      const data = await res.json();
      closeModal("modal-editor");
      toast(data.message);
    }

    async function uploadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("path", CURRENT_PATH);
      const res = await fetch(`/api/upload/${ACTIVE_SERVER_ID}`, { method: "POST", body: fd });
      const data = await res.json();
      toast(data.message);
      loadFiles();
    }

    async function newFolder() {
      const name = prompt("Folder Name:");
      if (!name) return;
      await fetch(`/api/create_folder/${ACTIVE_SERVER_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: CURRENT_PATH, name })
      });
      loadFiles();
    }

    async function extractZip(path) {
      const res = await fetch(`/api/extract/${ACTIVE_SERVER_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path })
      });
      const data = await res.json();
      toast(data.message);
      loadFiles();
    }

    async function deleteItem(path) {
      if (!confirm(`Delete ${path}?`)) return;
      await fetch(`/api/file/${ACTIVE_SERVER_ID}?path=${encodeURIComponent(path)}`, { method: "DELETE" });
      loadFiles();
    }

    // ==================== SETTINGS ====================
    async function saveSettings() {
      const name = document.getElementById("set-name").value.trim();
      const startup = document.getElementById("set-startup").value.trim();
      const reqs = document.getElementById("set-reqs").value.trim();

      const res = await fetch(`/api/server/${ACTIVE_SERVER_ID}/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, startup_file: startup, requirements_file: reqs })
      });
      const data = await res.json();
      toast(data.message);
      openServerManage(ACTIVE_SERVER_ID);
    }

    function escapeHtml(str) {
      return (str || "").replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t] || t));
    }

    window.onload = loadServers;
  </script>
</body>
</html>
